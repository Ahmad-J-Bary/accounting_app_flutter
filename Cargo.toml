[workspace]
resolver = "3"
members = [
    "cli",
    "packages/core",
    "packages/accounting_app_flutter_isolates/rust",
    "server/api",
    "crates/domain",
    "crates/application",
    "crates/infrastructure",
    "crates/bridge",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1", features = ["serde"] }
sqlx = { version = "0.7", features = ["sqlite", "runtime-tokio-rustls", "macros", "rust_decimal", "chrono", "uuid"] }

domain = { path = "crates/domain" }
application = { path = "crates/application" }
infrastructure = { path = "crates/infrastructure" }
bridge = { path = "crates/bridge" }

[profile.dev]
debug = "line-tables-only"
