name: Quality Gates

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  rust:
    name: Rust format, check and tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Check the full Rust workspace
        run: cargo check --workspace
      - name: Lint the full Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Rust workspace tests
        run: cargo test --workspace -- --test-threads=1

  flutter:
    name: Flutter format, analysis and tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve Dart workspace dependencies
        run: flutter pub get
      - name: Check Dart formatting
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analyze the Flutter app
        working-directory: app
        run: flutter analyze
      - name: Run Flutter widget tests
        working-directory: app
        run: flutter test test

  codegen:
    name: FRB codegen freshness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Cache flutter_rust_bridge_codegen
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/flutter_rust_bridge_codegen
            ~/.cargo/bin/flutter_rust_bridge_codegen.exe
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
          key: frb-codegen-2.13.0-${{ runner.os }}
      - name: Install flutter_rust_bridge_codegen 2.13.0
        run: cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
      - name: Resolve Dart workspace dependencies
        run: flutter pub get
      - name: Regenerate FRB bindings
        working-directory: packages/accounting_app_flutter_isolates
        run: flutter_rust_bridge_codegen generate
      - name: Normalise Rust formatting
        run: cargo fmt --all
      - name: Fail when generated bindings are stale
        run: |
          GENERATED_PATHS="packages/accounting_app_flutter_isolates/lib/src/rust packages/accounting_app_flutter_isolates/rust/src/frb_generated.rs"
          STATUS=$(git status --porcelain --untracked-files=all -- $GENERATED_PATHS)
          if [ -n "$STATUS" ]; then
            echo "Generated FRB bindings are stale:"
            echo "$STATUS"
            git diff -- $GENERATED_PATHS
            exit 1
          fi

  windows-build:
    name: Windows release build
    needs: [rust, flutter]
    uses: ./.github/workflows/build-windows.yml
    permissions:
      contents: read

  android-build:
    name: Android release build
    needs: [rust, flutter]
    uses: ./.github/workflows/build-android.yml
    permissions:
      contents: read
