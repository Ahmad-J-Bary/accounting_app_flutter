name: Build Android

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build-android:
    name: Android release APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # Do not use android-actions/setup-android@v3: it runs `sdkmanager tools`,
      # and Google removed the legacy `tools` package from the SDK repository.
      # The ubuntu-latest image already ships the Android SDK and sdkmanager.
      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | sort | tail -n1)"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "ndk;28.2.13676358" "cmake;3.22.1"
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v2.0.0
      - name: Install Rust stable and Android targets
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup target add --toolchain stable aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve Dart workspace dependencies
        run: flutter pub get
      - name: Build Android release APKs
        working-directory: app
        run: flutter build apk --release --split-per-abi
      - name: Verify the Rust libraries are packaged per ABI
        working-directory: app/build/app/outputs/flutter-apk
        run: |
          test -f app-arm64-v8a-release.apk
          test -f app-armeabi-v7a-release.apk
          for apk in app-*-release.apk; do
            case "$apk" in
              *arm64-v8a*) abi=arm64-v8a ;;
              *armeabi-v7a*) abi=armeabi-v7a ;;
              *x86_64*) abi=x86_64 ;;
              *)
                echo "Unexpected APK name: $apk" >&2
                exit 1
                ;;
            esac
            if ! unzip -l "$apk" | grep -q "lib/$abi/libaccounting_app_flutter_isolates.so"; then
              echo "Missing Rust library for $abi in $apk" >&2
              exit 1
            fi
            echo "Verified $apk ($abi)"
          done
          sha256sum app-*-release.apk > sha256sums.txt
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: |
            app/build/app/outputs/flutter-apk/app-*-release.apk
            app/build/app/outputs/flutter-apk/sha256sums.txt
          if-no-files-found: error
          retention-days: 14
