name: Release Draft

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Keep the GitHub release as a draft"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Each platform build lives in its own reusable workflow (also dispatchable
  # standalone), so the release and the individual build workflows cannot
  # drift apart. Each called workflow reads the version from app/pubspec.yaml
  # itself.
  build_windows:
    name: Build Windows
    uses: ./.github/workflows/build-windows.yml
    permissions:
      contents: read

  build_android:
    name: Build Android
    uses: ./.github/workflows/build-android.yml
    permissions:
      contents: read

  build_linux:
    name: Build Linux
    uses: ./.github/workflows/build-linux.yml
    permissions:
      contents: read

  draft_release:
    name: Draft GitHub release
    needs: [build_windows, build_android, build_linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # release-drafter needs the commit history to resolve the next
          # version and collect the changes since the previous release.
          fetch-depth: 0
          # Check out the exact commit that triggered the run. Fetching by tag
          # fails when the tag is moved or deleted after the run starts.
          ref: ${{ github.sha }}
      - name: Read application version
        id: version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          if [ -z "$VERSION" ]; then
            echo "Could not read the version from app/pubspec.yaml" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Download the Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: windows-x64-${{ steps.version.outputs.version }}
          path: dist/windows
      - name: Download the Android artifact
        uses: actions/download-artifact@v8
        with:
          name: android-release
          path: dist/android
      - name: Download the Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-x64-${{ steps.version.outputs.version }}
          path: dist/linux
      - name: Verify the published checksums
        run: |
          cd dist/windows
          sha256sum -c ./*.sha256
          cd ../android
          sha256sum -c sha256sums.txt
          cd ../linux
          sha256sum -c ./*.sha256
      - name: Check for an existing release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if gh release view "$TAG" --json tagName > /dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Create the release draft
        if: steps.release.outputs.exists == 'false'
        uses: release-drafter/release-drafter@v7
        with:
          tag: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          commitish: ${{ github.sha }}
          # release-drafter treats the `publish` input as a truthy string:
          # an empty value keeps the release as a draft, and the publish step
          # below flips it only when the operator asks for it.
          publish: ''
          # The 1.x desktop/handheld line ships as a pre-release until the
          # financial-year closing and partner-capital modules are complete.
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Refresh the release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          notes="docs/release-notes-${{ steps.version.outputs.version }}.md"
          if [ -f "$notes" ]; then
            gh release edit "$TAG" --notes-file "$notes" --prerelease
          else
            gh release edit "$TAG" --prerelease
          fi
      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          gh release upload "$TAG" dist/windows/* --clobber
          gh release upload "$TAG" dist/android/* --clobber
          gh release upload "$TAG" dist/linux/* --clobber
      - name: Publish the release when requested
        if: github.event.inputs.draft == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.version.outputs.version }}
        run: |
          gh release edit "$TAG" --draft=false --prerelease
