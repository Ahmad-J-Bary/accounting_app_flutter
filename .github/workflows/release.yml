name: Release Draft

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Keep the GitHub release as a draft"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # Each platform build lives in its own reusable workflow (also dispatchable
  # standalone), so the release and the individual build workflows cannot
  # drift apart. Each called workflow reads the version from app/pubspec.yaml
  # itself.
  build_windows:
    name: Build Windows
    uses: ./.github/workflows/build-windows.yml
    permissions:
      contents: read

  build_android:
    name: Build Android
    uses: ./.github/workflows/build-android.yml
    permissions:
      contents: read

  draft_release:
    name: Draft GitHub release
    needs: [build_windows, build_android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          # release-drafter needs the commit history to resolve the next
          # version and collect the changes since the previous release.
          fetch-depth: 0
      - name: Read application version
        id: version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          if [ -z "$VERSION" ]; then
            echo "Could not read the version from app/pubspec.yaml" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Download the Windows artifact
        uses: actions/download-artifact@v7
        with:
          name: windows-x64-${{ steps.version.outputs.version }}
          path: dist/windows
      - name: Download the Android artifact
        uses: actions/download-artifact@v7
        with:
          name: android-release
          path: dist/android
      - name: Verify the published checksums
        run: |
          cd dist/windows
          sha256sum -c ./*.sha256
          cd ../android
          sha256sum -c sha256sums.txt
      - name: Create or update the release draft
        id: draft
        uses: release-drafter/release-drafter@v6
        with:
          tag: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          commitish: ${{ github.sha }}
          # release-drafter treats the `publish` input as a truthy string:
          # any non-empty value publishes the release, and an empty value
          # keeps it as a draft. Only publish when the operator explicitly
          # asks for it with draft=false; tag pushes stay as drafts.
          publish: ${{ github.event.inputs.draft == 'false' && 'true' || '' }}
          # The 1.x desktop/handheld line ships as a pre-release until the
          # financial-year closing and partner-capital modules are complete.
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.draft.outputs.tag_name }}
        run: |
          gh release upload "$TAG" dist/windows/* --clobber
          gh release upload "$TAG" dist/android/* --clobber
