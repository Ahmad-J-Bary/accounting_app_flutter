name: Build Windows

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.9"

jobs:
  build-windows:
    name: Windows x64 release
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1.16.1
      - name: Read application version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path app/pubspec.yaml -Pattern '^version:\s*([0-9]+\.[0-9]+\.[0-9]+)' | Select-Object -First 1
          if ($null -eq $match) { throw 'Could not read the version from app/pubspec.yaml' }
          $version = $match.Matches[0].Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve Dart workspace dependencies
        run: flutter pub get
      - name: Build Windows release
        working-directory: app
        run: flutter build windows --release
      - name: Verify the Rust bridge DLL is packaged
        working-directory: app
        shell: pwsh
        run: |
          $dll = 'build/windows/x64/runner/Release/accounting_app_flutter_isolates.dll'
          if (-not (Test-Path $dll)) { throw "Missing Rust bridge DLL: $dll" }
          Get-Item $dll | Select-Object FullName, Length
      - name: Install Windows packaging tools
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup --no-progress -y
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw 'Inno Setup compiler was not found.' }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

          $wix = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (-not (Test-Path (Join-Path $wix 'candle.exe'))) {
            choco install wixtoolset --no-progress -y
            $wix = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          }
          if (-not (Test-Path (Join-Path $wix 'candle.exe'))) { throw 'WiX Toolset was not found.' }
          "WIXBIN=$wix" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build portable ZIP, EXE and MSI
        id: package
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $release = (Resolve-Path 'app/build/windows/x64/runner/Release').Path
          $dist = Join-Path (Get-Location) 'dist'
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          $zip = Join-Path $dist "accounting-app-$version-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$release/*" -DestinationPath $zip -CompressionLevel Optimal

          & $env:ISCC_PATH "/DAppVersion=$version" "/DSourceDir=$release" "/DOutputDir=$dist" 'installer/windows/accounting_app.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed.' }
          $setup = Join-Path $dist "accounting-app-$version-windows-x64-setup.exe"
          if (-not (Test-Path $setup)) { throw "Missing installer: $setup" }

          $msiBuild = Join-Path (Get-Location) 'app/build/msi'
          New-Item -ItemType Directory -Path $msiBuild -Force | Out-Null
          $heat = Join-Path $env:WIXBIN 'heat.exe'
          $product = Join-Path (Get-Location) 'installer/windows/Product.wxs'
          & $heat dir $release -cg AppFiles -gg -scom -sreg -sfrag -srd -dr INSTALLFOLDER -var var.SourceDir -out (Join-Path $msiBuild 'Files.wxs')
          if ($LASTEXITCODE -ne 0) { throw 'WiX heat failed.' }
          $msi = Join-Path $dist "accounting-app-$version-windows-x64.msi"
          Push-Location $msiBuild
          try {
            & (Join-Path $env:WIXBIN 'candle.exe') -arch x64 "-dAppVersion=$version" "-dSourceDir=$release" $product 'Files.wxs'
            if ($LASTEXITCODE -ne 0) { throw 'WiX candle failed.' }
            & (Join-Path $env:WIXBIN 'light.exe') -ext WixUIExtension -cultures:en-us -pdbtype none -out $msi 'Product.wixobj' 'Files.wixobj'
            if ($LASTEXITCODE -ne 0) { throw 'WiX light failed.' }
          } finally {
            Pop-Location
          }
          if (-not (Test-Path $msi)) { throw "Missing MSI: $msi" }

          Get-ChildItem $dist -File | Where-Object { $_.Extension -in '.zip', '.exe', '.msi' } | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $line = "$hash  $($_.Name)`n"
            [System.IO.File]::WriteAllText("$($_.FullName).sha256", $line, [System.Text.Encoding]::ASCII)
          }

          "artifact_dir=$dist" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v6
        with:
          name: windows-x64-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.package.outputs.artifact_dir }}/*
          if-no-files-found: error
          retention-days: 14
