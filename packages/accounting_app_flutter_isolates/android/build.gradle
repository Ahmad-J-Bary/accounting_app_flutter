// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.flutter_rust_bridge.accounting_app_flutter_isolates'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        classpath 'com.android.tools.build:gradle:8.11.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    if (project.android.hasProperty("namespace")) {
        namespace 'com.flutter_rust_bridge.accounting_app_flutter_isolates'
    }

    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app.
    // Kept in sync with the Flutter 3.41 default (app/android/app/build.gradle.kts
    // uses flutter.compileSdkVersion = 36). Do not lower it back to 33: the
    // Android SDK platform 33 is no longer installed/required by this project.
    compileSdkVersion 36

    // Use the NDK version
    // declared in /android/app/build.gradle file of the Flutter project.
    // Keep this explicit: `android.ndkVersion` is not inherited from the app in
    // this library module and falls back to the AGP default, which may be an
    // incomplete NDK installation. 28.2.13676358 is the Flutter 3.41.x default.
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        minSdkVersion 24
    }
}

apply from: "../cargokit/gradle/plugin.gradle"
cargokit {
    manifestDir = "../rust"
    libname = "accounting_app_flutter_isolates"
}
